services:
  db:
    image: postgis/postgis:16-3.4
    container_name: drs_db
    environment:
      POSTGRES_USER: drs
      POSTGRES_PASSWORD: drs
      POSTGRES_DB: drs
    ports:
      - "5432:5432"
    volumes:
      - drs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drs -d drs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: drs_redis
    ports:
      - "6379:6379"
    volumes:
      - drs_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  drs_pgdata:
  drs_redisdata:
