services:
  db:
    image: postgis/postgis:16-3.4
    container_name: drs_db
    environment:
      POSTGRES_USER: drs
      POSTGRES_PASSWORD: drs
      POSTGRES_DB: drs
    ports:
      - "5432:5432"
    volumes:
      - drs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drs -d drs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: drs_redis
    ports:
      - "6379:6379"
    volumes:
      - drs_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Transaction-pooling in front of Postgres. Opt-in: `docker compose --profile prod up`.
  # Then set DB_POOL_MODE=pgbouncer and point DATABASE_URL at port 6432.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: drs_pgbouncer
    profiles: ["prod"]
    environment:
      DB_HOST: db
      DB_USER: drs
      DB_PASSWORD: drs
      DB_NAME: drs
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  drs_pgdata:
  drs_redisdata:
