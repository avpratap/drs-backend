name: backend-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: drs
          POSTGRES_PASSWORD: drs
          POSTGRES_DB: drs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drs -d drs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://drs:drs@localhost:5432/drs
        run: uv run alembic upgrade head

      - name: Run tests
        env:
          # conftest recreates drs_test from the drs maintenance DB on localhost.
          DATABASE_URL: postgresql+asyncpg://drs:drs@localhost:5432/drs
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q
