# Fly.io (Mumbai) — DRS backend API. The ARQ worker runs as a separate process/app
# with the same image (override the start command to the worker).
app = "drs-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run migrations before the new version takes traffic (zero-downtime; additive migs).
  release_command = "uv run alembic upgrade head"
  strategy = "rolling"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
