[project]
name = "drs-backend"
version = "0.1.0"
description = "DRS dairy platform API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "geoalchemy2>=0.15",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "arq>=0.25",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]
# B008: FastAPI Depends/Query/etc. in defaults is idiomatic (see immutable-calls).
# RUF012: ARQ WorkerSettings uses plain class-level lists by design.
# E501: line length is handled by `ruff format`; don't gate CI on legacy long lines.
ignore = ["RUF012", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before app imports

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
# SQLAlchemy async dispatches through greenlets; without this, service code that
# runs under a DB call is undercounted.
concurrency = ["thread", "greenlet"]
omit = ["app/seed.py", "app/worker.py"]
